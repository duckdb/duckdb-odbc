name: CodeQuality
on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches:
      - '**'
      - '!main'
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - '!.github/workflows/CodeQuality.yml'

  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
      - '!.github/workflows/CodeQuality.yml'

jobs:
  format-check:
    name: Format Check
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-slim' || 'ubuntu-latest' }}
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'vendoring-')) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          python -m pip install --user --break-system-packages \
            black==25.1.0        \
            clang_format==11.0.1 \
            cmake-format==0.6.13
          export PATH=~/.local/bin:$PATH
          python -m pip show black
          python -m pip show cmake_format
          python -m pip show clang_format
          which clang-format
          clang-format --version
          make format-check-silent
